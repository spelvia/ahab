# cargo-deny for the desktop app, a Cargo workspace of its own
# (`make lint`). The same rules as Ahab's deny.toml; its own advisories.
[advisories]
yanked = "deny"
ignore = [
	# Unmaintained, not vulnerabilities: zvariant and friends moved into zbus 6,
	# while secret-service and Tauri's plugins (opener, single-instance) are
	# still on zbus 5. Goes when they move. Added 2026-11-18.
	{ id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained only; waits on zbus 6 in Tauri's plugins and secret-service" },
	{ id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained only; waits on zbus 6 in Tauri's plugins and secret-service" },
	{ id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained only; waits on zbus 6 in Tauri's plugins and secret-service" },
	# Unmaintained, a build-time macro crate of the GTK 3 bindings Tauri's
	# Linux backend uses (glib-macros). Goes when Tauri moves to GTK 4.
	{ id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build time only, through Tauri's GTK 3 bindings" },
]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	# A public-domain dedication (notify, for watching files).
	"CC0-1.0",
	"CDLA-Permissive-2.0",
	"ISC",
	"MIT",
	"MPL-2.0",
	"Unicode-3.0",
	"Zlib",
]
# Ahab's own crates are unpublished and unlicensed for now.
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["ssh://git@github.com/spelvia/stubb.git"]

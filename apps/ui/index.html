<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Ahab: a self-hostable control plane for human-led, agent-assisted software work."
		/>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!-- Installable as an app: its own window, where Ctrl+W and Ctrl+T reach Ahab. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#232322" />
		<title>Ahab</title>
		<script>
			// Apply the theme before the first paint: the one chosen in Settings →
			// Appearance, else graphite dark by default and warm-paper light when
			// the system asks for light. The desktop app shows this
			// same page: when it goes from its own copy to a server's, the
			// splash continues without fading in again.
			let chosen;
			try {
				chosen = JSON.parse(localStorage.getItem("ahab.preferences.v1") || "{}").appearance?.theme;
			} catch {}
			const dark =
				chosen === "dark" ||
				(chosen !== "light" && !matchMedia("(prefers-color-scheme: light)").matches);
			document.documentElement.classList.toggle("dark", dark);
			document.documentElement.classList.toggle("in-app", "__AHAB_APP__" in window);
			document.documentElement.style.colorScheme = dark ? "dark" : "light";
		</script>
		<!-- splash:style -->
		<style>
			html {
				background: #252526;
			}
			html:not(.dark) {
				background: #f4f2ea;
			}
			#splash {
				position: fixed;
				inset: 0;
				z-index: 2147483000;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 22px;
				background: #252526;
				color: #f1f1f1;
				transition: opacity 180ms ease-out;
			}
			html:not(.dark) #splash {
				background: #f4f2ea;
				color: #182321;
			}
			#splash {
				--weave-mid: #d6d6d2;
				--weave-low: #b4b4af;
				--weave-edge: #5e5e5b;
			}
			html:not(.dark) #splash {
				--weave-mid: #33403c;
				--weave-low: #4d5955;
				--weave-edge: #a3aba7;
			}
			#splash .splash-mark {
				width: 92px;
				aspect-ratio: 422.9 / 308.9;
				perspective: 520px;
				opacity: 0;
				animation: splash-in 260ms ease-out 120ms forwards;
			}
			/* In the desktop app the app's own splash was showing already: no fade in again. */
			html.in-app #splash .splash-mark {
				animation: none;
				opacity: 1;
			}
			#splash .weave {
				position: relative;
				width: 100%;
				height: 100%;
				transform-style: preserve-3d;
				transform: rotateX(16deg) rotateY(-24deg);
				animation: weave-turn 4.8s ease-in-out infinite alternate;
			}
			#splash .weave svg {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				fill: currentColor;
				transform: translateZ(var(--z));
			}
			#splash .weave .face-a {
				fill: var(--weave-mid);
			}
			#splash .weave .face-c {
				fill: var(--weave-low);
			}
			#splash .weave .edge {
				fill: var(--weave-edge);
			}
			#splash p {
				margin: 0;
				min-height: 1.4em;
				font:
					13px/1.4 system-ui,
					sans-serif;
				color: #9a9a96;
			}
			html:not(.dark) #splash p {
				color: #5b6662;
			}
			#splash.splash-done {
				opacity: 0;
				pointer-events: none;
			}
			@keyframes splash-in {
				from {
					opacity: 0;
					transform: scale(0.96);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}
			@keyframes weave-turn {
				from {
					transform: rotateX(16deg) rotateY(-24deg);
				}
				to {
					transform: rotateX(10deg) rotateY(24deg);
				}
			}
			@keyframes splash-show {
				to {
					opacity: 1;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#splash {
					transition: none;
				}
				#splash .splash-mark {
					animation: splash-show 1ms step-end 120ms forwards;
				}
				#splash .weave {
					animation: none;
				}
			}
		</style>
		<!-- /splash:style -->
	</head>
	<body>
		<!-- splash:markup -->
		<div id="splash" aria-hidden="true">
			<!-- The weave mark in 3D: each strand at its own depth (they cross over and under), with an edge, turning slowly. -->
			<div class="splash-mark">
				<svg width="0" height="0" style="position: absolute">
					<defs>
						<symbol id="weave-a" viewBox="0 0 422.901866 308.883421">
							<path
								transform="translate(-12.985791,322.02742) scale(0.1,-0.1)"
								d="M3165 3201 c-133 -39 -190 -82 -408 -311 -166 -173 -176 -186 -159 -201 135 -125 468 -433 504 -467 l47 -45 82 76 c134 125 134 126 349 -95 l145 -149 -295 -287 c-450 -439 -507 -491 -564 -518 -119 -56 -90 -77 -729 520 -148 138 -273 251 -278 251 -5 0 -144 -135 -309 -300 l-301 -300 58 -55 c32 -30 200 -186 373 -345 172 -160 373 -344 445 -410 244 -226 311 -282 376 -313 221 -108 446 -74 631 95 215 196 1080 1030 1105 1066 92 128 114 208 120 437 12 453 -30 630 -187 790 -140 143 -531 478 -598 513 -128 68 -279 85 -407 48z"
							/>
						</symbol>
						<symbol id="weave-b" viewBox="0 0 422.901866 308.883421">
							<path
								transform="translate(-12.985791,322.02742) scale(0.1,-0.1)"
								d="M1490 3165 c-116 -38 -165 -77 -512 -415 -177 -173 -399 -389 -493 -480 -210 -204 -236 -235 -286 -335 -111 -224 -88 -469 65 -698 56 -85 186 -231 236 -267 l28 -20 -10 37 c-17 63 -5 174 24 224 24 40 768 780 928 924 105 94 182 121 255 91 34 -14 344 -295 762 -690 l43 -40 285 285 c157 156 284 289 283 295 -2 7 -73 76 -159 155 -85 79 -292 271 -460 425 -412 381 -480 439 -564 479 -132 62 -290 73 -425 30z"
							/>
						</symbol>
						<symbol id="weave-c" viewBox="0 0 422.901866 308.883421">
							<path
								transform="translate(-12.985791,322.02742) scale(0.1,-0.1)"
								d="M1019 1128 c-293 -306 -323 -351 -349 -513 -61 -382 363 -623 695 -395 26 18 144 128 263 246 l217 214 -56 53 c-318 297 -600 557 -607 557 -4 0 -77 -73 -163 -162z"
							/>
						</symbol>
					</defs>
				</svg>
				<div class="weave">
					<!-- the end that passes under: its edge, then its face -->
					<svg class="edge" style="--z: -14px"><use href="#weave-c" /></svg>
					<svg class="edge" style="--z: -13px"><use href="#weave-c" /></svg>
					<svg class="edge" style="--z: -12px"><use href="#weave-c" /></svg>
					<svg class="edge" style="--z: -11px"><use href="#weave-c" /></svg>
					<svg class="edge" style="--z: -10px"><use href="#weave-c" /></svg>
					<svg class="edge" style="--z: -9px"><use href="#weave-c" /></svg>
					<svg class="face-c" style="--z: -8px"><use href="#weave-c" /></svg>
					<!-- the link in the middle: its edge, then its face -->
					<svg class="edge" style="--z: -6px"><use href="#weave-a" /></svg>
					<svg class="edge" style="--z: -5px"><use href="#weave-a" /></svg>
					<svg class="edge" style="--z: -4px"><use href="#weave-a" /></svg>
					<svg class="edge" style="--z: -3px"><use href="#weave-a" /></svg>
					<svg class="edge" style="--z: -2px"><use href="#weave-a" /></svg>
					<svg class="edge" style="--z: -1px"><use href="#weave-a" /></svg>
					<svg class="face-a" style="--z: 0px"><use href="#weave-a" /></svg>
					<!-- the link on top: its edge, then its face -->
					<svg class="edge" style="--z: 2px"><use href="#weave-b" /></svg>
					<svg class="edge" style="--z: 3px"><use href="#weave-b" /></svg>
					<svg class="edge" style="--z: 4px"><use href="#weave-b" /></svg>
					<svg class="edge" style="--z: 5px"><use href="#weave-b" /></svg>
					<svg class="edge" style="--z: 6px"><use href="#weave-b" /></svg>
					<svg class="edge" style="--z: 7px"><use href="#weave-b" /></svg>
					<svg class="face-b" style="--z: 8px"><use href="#weave-b" /></svg>
				</div>
			</div>
			<p id="splash-status"></p>
		</div>
		<!-- /splash:markup -->
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Ahab: a self-hostable control plane for human-led, agent-assisted software work."
		/>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!-- Installable as an app: its own window, where Ctrl+W and Ctrl+T reach Ahab. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#232322" />
		<title>Ahab</title>
		<script>
			// Apply the theme before the first paint: the one chosen in Settings →
			// Appearance, else graphite dark by default and warm-paper light when
			// the system asks for light. The desktop app shows this
			// same page: when it goes from its own copy to a server's, the
			// splash continues without fading in again.
			let chosen;
			try {
				chosen = JSON.parse(localStorage.getItem("ahab.preferences.v1") || "{}").appearance?.theme;
			} catch {}
			const dark =
				chosen === "dark" ||
				(chosen !== "light" && !matchMedia("(prefers-color-scheme: light)").matches);
			document.documentElement.classList.toggle("dark", dark);
			document.documentElement.classList.toggle("in-app", "__AHAB_APP__" in window);
			document.documentElement.style.colorScheme = dark ? "dark" : "light";
		</script>
		<!-- splash:style -->
		<style>
			html {
				background: #252526;
			}
			html:not(.dark) {
				background: #f4f2ea;
			}
			#splash {
				position: fixed;
				inset: 0;
				z-index: 2147483000;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 22px;
				background: #252526;
				color: #f1f1f1;
				transition: opacity 180ms ease-out;
			}
			html:not(.dark) #splash {
				background: #f4f2ea;
				color: #182321;
			}
			#splash svg {
				width: 76px;
				height: auto;
				opacity: 0;
				animation: splash-in 260ms ease-out 120ms forwards;
			}
			/* In the desktop app the app's own splash was showing already: no fade in again. */
			html.in-app #splash svg {
				animation: none;
				opacity: 1;
			}
			#splash p {
				margin: 0;
				min-height: 1.4em;
				font:
					13px/1.4 system-ui,
					sans-serif;
				color: #9a9a96;
			}
			html:not(.dark) #splash p {
				color: #5b6662;
			}
			#splash.splash-done {
				opacity: 0;
				pointer-events: none;
			}
			@keyframes splash-in {
				from {
					opacity: 0;
					transform: scale(0.96);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}
			@keyframes splash-show {
				to {
					opacity: 1;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#splash {
					transition: none;
				}
				#splash svg {
					animation: splash-show 1ms step-end 120ms forwards;
				}
			}
		</style>
		<!-- /splash:style -->
	</head>
	<body>
		<!-- splash:markup -->
		<div id="splash" aria-hidden="true">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 422.901866 308.883421">

					/>
					<path

			<p id="splash-status"></p>

		<!-- /splash:markup -->
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>

# TOML formatting (taplo), checked by `make lint` and CI. Keys keep their
# order: cargo-sort orders Cargo.toml's dependencies.
include = ["**/*.toml"]
exclude = [
	"target/**",
	"node_modules/**",
	"**/node_modules/**",
	"apps/native/target/**",
	"apps/native/gen/**",
	"apps/native/permissions/autogenerated/**",
]

[formatting]
align_entries = false
array_auto_collapse = true
array_auto_expand = true
column_width = 100
indent_string = "\t"
reorder_keys = false

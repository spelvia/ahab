name: Pages

# The website at https://useahab.com: the landing page at `/`, the
# documentation under `/docs`, the changelog at `/changelog` (from
# docs/releases) and the install script at `/install.sh`, all built from
# apps/docs. GitHub Pages serves it while the repository is
# public.

# On every push to main: a path filter would miss force-pushed history.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    # Pages needs a public repository on GitHub's free plan.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Install pnpm
        # The version package.json pins (packageManager).
        run: npm install --global "$(node --print 'require("./package.json").packageManager')" # zizmor: ignore[adhoc-packages]
      - name: Build
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @ahab/docs build
          # The custom domain, kept with every deploy.
          echo useahab.com > apps/docs/dist/CNAME
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
